name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compile-test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: sbt

      - name: Ensure mill script is executable
        run: chmod +x mill

      - name: Compile all modules
        run: ./mill __.compile

      - name: Run tests
        run: ./mill __.test

      - name: Generate aggregated scoverage XML report
        run: ./mill scoverage.scoverage.xmlReportAll

      - name: Upload report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: out/scoverage/scoverage/xmlReportAll.dest/scoverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
