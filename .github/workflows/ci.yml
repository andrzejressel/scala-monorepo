name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-test-coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-2025
          # No temurin support
          # - os: windows
          #   arch: arm64
          #   runner: windows-11-arm
          - os: macos
            arch: amd64
            runner: macos-26-intel
          - os: macos
            arch: arm64
            runner: macos-26 
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile all modules
        run: ./mill __.compile

      - name: Run tests
        run: ./mill __.test

      - name: Generate aggregated scoverage XML report
        run: ./mill scoverage.xmlReportAll

      - name: Upload report to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: out/scoverage/xmlReportAll.dest/scoverage.xml
          fail_ci_if_error: true

  notify-success:
    name: notify-success
    if: ${{ always() }}
    needs:
      - compile-test-coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all prerequisite jobs succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              job_name: job_data.get("result")
              for job_name, job_data in needs.items()
              if job_data.get("result") != "success"
          }

          if failed:
              print(f"Some prerequisite jobs did not succeed: {failed}")
              sys.exit(1)

          print("All prerequisite jobs succeeded.")
          PY
