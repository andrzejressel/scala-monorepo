name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compile-test-coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
          - os: macos
            arch: amd64
            runner: macos-26-intel
          - os: macos
            arch: arm64
            runner: macos-26 
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all modules
        run: ./mill __.compile

      - name: Run tests
        run: ./mill __.test

      - name: Generate aggregated scoverage XML report
        run: ./mill scoverage.xmlReportAll

      - name: Upload report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: out/scoverage/xmlReportAll.dest/scoverage.xml
          fail_ci_if_error: true
